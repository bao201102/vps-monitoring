# Build & run directly on the VPS (no registry):
#   docker compose up -d --build
# Bundled Mongo is optional. For Atlas / another server, set MONGODB_URI in .env and run:
#   docker compose up -d --build --no-deps web

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    # mongo:5+ needs a CPU with AVX on x86_64. Without it (grep -c avx /proc/cpuinfo = 0),
    # set MONGO_IMAGE=mongo:4.4 in .env.
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    volumes:
      - ./mongo_data:/data/db
    healthcheck:
      # mongo:4.4 ships the legacy `mongo` shell, newer images ship `mongosh`.
      test: [ "CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null || mongo --quiet --eval 'db.adminCommand({ping:1}).ok'" ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  web:
    build:
      context: .
      args:
        # Heap cap (MB) for `next build`. Lower it on small VPS (e.g. 1024 on 2GB RAM).
        NODE_MAX_OLD_SPACE: ${BUILD_NODE_MAX_OLD_SPACE:-2048}
    image: vps-monitoring:local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Override in .env for external Mongo (Atlas, VPS, …). Default = service name `mongo` in this file.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/vps-monitoring}
      JWT_SECRET: ${JWT_SECRET:?Please set JWT_SECRET in .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3005}
      AGENT_OFFLINE_AFTER_SECONDS: ${AGENT_OFFLINE_AFTER_SECONDS:-60}
    ports:
      - "${PORT:-3005}:3000"
    logging: *default-logging
