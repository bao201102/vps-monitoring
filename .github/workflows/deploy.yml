name: VPS Monitoring CI/CD

on:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Only one deploy at a time: a newer push waits instead of building concurrently on the VPS.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  # Job 1: Source code lint check
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # Job 2: Pull code and build the image directly on the VPS (no registry)
  deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Build & deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Building Next.js on a small VPS can take a while.
          command_timeout: 30m
          script: |
            set -e
            cd /home/ubuntu/vps-monitoring
            # Fails (instead of overwriting) if the VPS checkout has diverged or has conflicting local edits.
            git pull --ff-only origin main
            # Build first; the running container is only replaced if the build succeeds.
            sudo docker compose up -d --build --remove-orphans
            # Drop the previous (now dangling) image and stale build cache.
            sudo docker image prune -f
            sudo docker builder prune -f --filter until=168h
            sudo docker compose ps

  # Job 3: Send result notification to Telegram (Always runs)
  notify-telegram:
    needs: [lint, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        run: |
          STATUS_UPPER="SUCCESS"
          STATUS_EMOJI="✅"

          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.deploy.result }}" != "success" ]; then
            STATUS_UPPER="FAILURE"
            STATUS_EMOJI="❌"
          fi

          TIMESTAMP=$(TZ='Asia/Ho_Chi_Minh' date +"%Y-%m-%d %H:%M:%S")
          
          # Calculate duration from commit timestamp to completion
          START_TIME=$(date -d "${{ github.event.head_commit.timestamp }}" +%s)
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          Next_SECONDS=$((DURATION % 60))
          
          MESSAGE="${STATUS_EMOJI} *${STATUS_UPPER}* ${TIMESTAMP}
          
          Repository: \`${{ github.repository }}\`
          Build: #${{ github.run_number }}
          Duration: ${MINUTES}m ${Next_SECONDS}s
          
          [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          # Safely check if TELEGRAM_TOPIC_ID is empty to prevent JSON syntax errors
          TOPIC_JSON=""
          if [ -n "${{ secrets.TELEGRAM_TOPIC_ID }}" ]; then
            TOPIC_JSON="\"message_thread_id\": ${{ secrets.TELEGRAM_TOPIC_ID }},"
          fi
          
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              ${TOPIC_JSON}
              \"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\",
              \"text\": \"${MESSAGE}\",
              \"parse_mode\": \"Markdown\",
              \"disable_web_page_preview\": true
            }"
